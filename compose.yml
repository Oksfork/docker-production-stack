services:
  backend:
    container_name: docker-production-be
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - 8001:8001
    env_file:
      - .env

  frontend:
    container_name: docker-production-fe
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - 3011:3000
    depends_on:
      - backend